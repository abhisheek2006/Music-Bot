[project]
name = "telegram-music-bot"
version = "1.0.0"
description = "Telegram group voice-chat music bot built with Pyrogram and PyTgCalls (NTgCalls)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pyright]
pythonVersion = "3.12"
