[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:telebot]
command=/opt/telebot/venv/bin/python /opt/telebot/bot.py
directory=/opt/telebot
user=root
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
stdout_logfile=/opt/telebot/logs/bot.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/opt/telebot/logs/bot_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=PYTHONUNBUFFERED="1"
